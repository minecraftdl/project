name: RDP - Localtonet (Singapore)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Allow" 2>$null
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start Localtonet Tunnel
        env:
          MY_TOKEN: ${{ secrets.LOCALTONET_TOKEN }}
        run: |
          # Perbaikan URL download resmi Windows x64 dari Localtonet
          $zipUrl = "https://localtonet.com/download/localtonet-win-64.zip"
          $installerPath = "$env:TEMP\localtonet.zip"
          
          Write-Host "Mengunduh Localtonet dari sumber resmi..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
          Expand-Archive -Path $installerPath -DestinationPath "$env:TEMP\localtonet_extracted" -Force
          
          # Cari file .exe secara otomatis di dalam folder hasil ekstrak
          $exePath = (Get-ChildItem -Path "$env:TEMP\localtonet_extracted" -Filter "localtonet.exe" -Recurse).FullName
          
          if (-not $exePath) {
              Write-Error "File localtonet.exe tidak ditemukan setelah ekstrak!"
              exit 1
          }
          
          Write-Host "Menjalankan Localtonet dengan AuthToken..."
          # Menjalankan aplikasi dengan argumen --authtoken
          Start-Process -FilePath $exePath -ArgumentList "--authtoken", "$env:MY_TOKEN" -NoNewWindow -RedirectStandardOutput "localtonet_log.txt" -RedirectStandardError "localtonet_err.txt"
          
          Start-Sleep -Seconds 10
          
          Write-Host "=== LOG OUTPUT ==="
          Get-Content localtonet_log.txt -ErrorAction SilentlyContinue
          Get-Content localtonet_err.txt -ErrorAction SilentlyContinue

      - name: Maintain Connection
        run: |
          Write-Host "`n=============================="
          Write-Host "       RDP ACCESS INFO"
          Write-Host "=============================="
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "Address  : Cek alamat IP dan Port di Dashboard Localtonet Anda (Menu 'My Tunnels')"
          Write-Host "==============================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Aktif - Maksimal 6 Jam"
              Start-Sleep -Seconds 300
          }
